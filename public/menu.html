<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú y Kiosco | Último Bondi</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="icon" type="image/x-icon" href="images/ultimobondi.ico">
</head>
<body>
    <header id="site-header"></header>

    <main>
        <section class="page-header">
            <div class="container">
                <h1>NUESTRO MENÚ Y KIOSCO</h1>
                <p>Elegí tus productos, sumalos al pedido y coordiná tu horario de retiro en el local.</p>
            </div>
        </section>

        <section class="section">
            <div class="container">
                <div class="filter-bar">
                    <input type="search" id="search-input" class="input-field" placeholder="🔍 Buscar pastel de papas, pancho, café...">
                    <select id="category-select" class="select-field">
                        <option value="">Todas las categorías</option>
                    </select>
                    <select id="sort-select" class="select-field">
                        <option value="">Ordenar por...</option>
                        <option value="price-asc">Menor precio</option>
                        <option value="price-desc">Mayor precio</option>
                        <option value="name">Nombre (A-Z)</option>
                    </select>
                </div>

                <div class="grid-cards" id="catalog-list"></div>
            </div>
        </section>
    </main>

    <footer id="site-footer"></footer>

    <script src="scripts/layout.js"></script>
    <script src="scripts/cart.js"></script>
    <script src="scripts/menu.js"></script>
</body>
</html>
